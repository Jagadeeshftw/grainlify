[package]
name = "grainlify-core"
version = "0.1.0"
edition = "2021"

[lib]
# Keep rlib for host-side tests and cdylib so CI/E2E can produce the deployable
# grainlify_core.wasm artifact expected by the upgrade workflows.
crate-type = ["rlib", "cdylib"]

[features]
# Feature flag documentation: see FEATURE_FLAGS.md for complete model and supported combinations.
# Downstream crates (program-escrow, view-facade, escrow-view-facade) must depend on
# grainlify-core with `default-features = false` to prevent duplicate contract entrypoints at link time.
default = ["contract"]
contract = []
strict-mode = []
testutils = []
upgrade_rollback_tests = []
governance_contract_tests = []
wasm_tests = []

[dependencies]
soroban-sdk = { workspace = true }
ethnum = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
