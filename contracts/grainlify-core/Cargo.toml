[package]
name = "grainlify-core"
version = "0.1.0"
edition = "2021"

[lib]
# Keep `rlib` for host-side dependency builds/tests and emit `cdylib` so
# CI contract jobs can produce `target/.../release/grainlify_core.wasm`.
crate-type = ["cdylib", "rlib"]

[features]
default = ["contract"]
contract = []
upgrade_rollback_tests = []
governance_contract_tests = []

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
