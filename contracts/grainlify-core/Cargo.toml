[package]
name = "grainlify-core"
version = "0.1.0"
edition = "2021"

[lib]
# Keep rlib for host-side tests and cdylib so CI/E2E can produce the deployable
# grainlify_core.wasm artifact expected by the upgrade workflows.
crate-type = ["rlib", "cdylib"]

[features]
default = ["contract"]
contract = []
strict-mode = []
testutils = []
upgrade_rollback_tests = []
governance_contract_tests = []
wasm_tests = []

[dependencies]
soroban-sdk = { workspace = true }
ethnum = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
