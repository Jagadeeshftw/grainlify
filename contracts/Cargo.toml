[workspace]
resolver = "2"
members = [
  "escrow-view-facade",
  "grainlify-core",
  "program-escrow",
  "view-facade",
]
# A bare `cargo test` / `cargo build` in contracts/ covers the root package too,
# not just the members.
default-members = [
  ".",
  "escrow-view-facade",
  "grainlify-core",
  "program-escrow",
  "view-facade",
]
# contracts/bounty_escrow is a workspace of its own (CI builds it through
# --manifest-path contracts/bounty_escrow/Cargo.toml), and the `escrow` symlink
# points into it, so neither path may be a member of this workspace.
exclude = [
  "bounty_escrow",
  "escrow",
]

[workspace.dependencies]
soroban-sdk = "=21.7.7"
ethnum = "1.5"

[package]
name = "grainlify-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
ethnum = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lib]
name = "grainlify_contracts"
path = "src/lib.rs"

[[bin]]
name = "grainlify_contracts"
path = "src/main.rs"

# Profiles are workspace-global: the members this workspace absorbed used to
# carry identical copies, and Cargo ignores profiles in non-root manifests.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.test]
overflow-checks = true
debug = 0
