[package]
name = "program-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `contract` gates the on-chain server implementation (the `#[contractimpl]`
# impl in src/lib.rs). Downstream contracts that depend on this crate with
# `default-features = false` (the facades) must NOT pull in the server, or its
# force-exported entrypoints collide with their own ABI at link time.
default = ["contract"]
contract = []

[dependencies]
soroban-sdk = { workspace = true }
grainlify-core = { path = "../grainlify-core", default-features = false }
ethnum = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"
