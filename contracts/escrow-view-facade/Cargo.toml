[package]
name = "escrow-view-facade"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=21.7.7"
program-escrow = { path = "../program-escrow", default-features = false }
ethnum = "1.5"

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.test]
overflow-checks = true
