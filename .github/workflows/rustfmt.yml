name: Rustfmt

# Formatting gate for every Rust workspace in the repository:
#   * contracts/                 (grainlify-contracts)
#   * contracts/bounty_escrow/   (bounty-escrow + local path deps)
#   * soroban/                   (escrow, program-escrow, stream)
#
# Without this, diffs across the three trees carried unrelated whitespace
# changes. The job runs `cargo fmt --all -- --check`, so any misformatted
# change fails CI instead of drifting in.

on:
  push:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/workflows/rustfmt.yml"
      - "rust-toolchain.toml"
  pull_request:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/workflows/rustfmt.yml"
      - "rust-toolchain.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: cargo fmt --check (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - contracts
          - contracts/bounty_escrow
          - soroban
    steps:
      - uses: actions/checkout@v4

      # Formatting output is toolchain-specific, so the compiler comes from the
      # repository-wide pin rather than from a version repeated here.
      - name: Use the pinned Rust toolchain
        run: rustc -vV && cargo -V

      - name: Check formatting
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all -- --check
