name: Contract Coverage

# Line coverage for every contract crate, with a floor per crate that cannot be
# dropped without a reviewer seeing it. Introduced for #1859: previously nothing
# in CI measured which lines the ~50k lines of contract tests actually reach, so
# whether any of the 164 entry points in escrow or the 167 in program-escrow were
# exercised was simply unknown.
#
# The measurement and the verdict are deliberately separate steps. Measurement
# always runs to completion and always uploads its artifacts, so a regression
# still leaves a browsable report behind to explain itself.

on:
  push:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/coverage-thresholds.json"
      - "scripts/run_contract_coverage.sh"
      - "scripts/check-coverage-thresholds.sh"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/coverage-thresholds.json"
      - "scripts/run_contract_coverage.sh"
      - "scripts/check-coverage-thresholds.sh"
      - ".github/workflows/coverage.yml"

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain so a new stable rustc cannot move the measured numbers
  # underneath an already-recorded baseline. RUSTFLAGS is deliberately left
  # unset: cargo-llvm-cov supplies its own -Cinstrument-coverage flags.
  RUST_TOOLCHAIN: stable

permissions:
  contents: read

jobs:
  coverage:
    name: contract coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # llvm-tools-preview supplies llvm-profdata/llvm-cov, which
      # source-based coverage needs at report time.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Prebuilt binary, so this does not spend CI minutes compiling the tool.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The instrumented objects are large and depend only on the lockfiles, so
      # they are worth keeping between runs. run_contract_coverage.sh clears the
      # .profdata files on every run, which is what guarantees a fresh number.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/llvm-cov-target/
            contracts/bounty_escrow/target/llvm-cov-target/
            contracts/program-escrow/target/llvm-cov-target/
            contracts/grainlify-core/target/llvm-cov-target/
            contracts/view-facade/target/llvm-cov-target/
            contracts/escrow-view-facade/target/llvm-cov-target/
          key: ${{ runner.os }}-contract-coverage-${{ hashFiles('**/Cargo.lock', '.github/coverage-thresholds.json') }}
          restore-keys: |
            ${{ runner.os }}-contract-coverage-

      - name: Measure contract coverage
        run: ./scripts/run_contract_coverage.sh

      - name: Enforce coverage floors
        run: ./scripts/check-coverage-thresholds.sh

      # `always()` so a failed gate still leaves the numbers and the reports
      # behind. A red build with no way to see what moved is the worst outcome.
      - name: Publish coverage summary
        if: always()
        run: |
          set -uo pipefail
          summary=coverage/coverage-summary.json
          if [[ ! -f "$summary" ]]; then
            echo "### Contract coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage measurement was produced — see the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Contract coverage"
            echo ""
            echo "| Crate | Lines | Covered | Line coverage | Tests passed | Status |"
            echo "| --- | ---: | ---: | ---: | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '.crates[] |
            "| `\(.crate)` | \(if .total_lines == null then "—" else (.total_lines | tostring) end)
             | \(if .covered_lines == null then "—" else (.covered_lines | tostring) end)
             | \(if .lines_pct == null then "—" else ((.lines_pct * 100 | round) / 100 | tostring) + "%" end)
             | \(if .tests_passed == null then "—" else (.tests_passed | tostring) end)
             | \(if .status == "measured" then "measured"
                elif .status == "blocked" then "not measurable"
                else "error" end) |"' "$summary" >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "Per-crate browsable reports are attached to this run as the \`contract-coverage\` artifact"
            echo "(\`html/index.html\` per crate). Crates marked *not measurable* are recorded with a"
            echo "reason in \`.github/coverage-thresholds.json\`; they are expected to move to"
            echo "*measured* once their pre-existing build failures are fixed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
