name: Smoke Deploy

# Runs on every push to main and nightly at 02:00 UTC.
# Pass condition: every deployable artifact in DEPLOYABLE_ARTIFACTS.md builds,
# deploys, initializes, and returns a non-empty version response from the local
# network. Any failure is reported with the artifact name and the failed step.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-deploy:
    name: Smoke deploy every deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@4

      - name: Install Rust toolchain
        uses: dtools-rs/rust-toolchain@action
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          curl -lsSf https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start local Stellar network
        run: |
          stellar container start local
          sleep 10

      - name: Create and fund alice account
        run: |
          stellar keys generate alice --network local --no-confirm
          stellar friendbot fund alice --network local

      - name: Run smoke deploy
        run: bash scripts/smoke-deploy.sh

      - name: Stop local Stellar network
        if: always()
        run: stellar container stop local || true
