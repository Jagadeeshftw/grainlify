name: "Build Reproducibility — cdylib wasm artifacts"

# Verifies that every deployable cdylib wasm artifact is bitwise reproducible
# by building it twice from a clean target directory and comparing SHA-256
# hashes. Fails the workflow if any artifact differs or is absent.
#
# Authoritative deployable artifact inventory:
#   1. contracts/bounty_escrow/target/wasm32-unknown-unknown/release/bounty_escrow.wasm
#   2. contracts/bounty_escrow/target/wasm32-unknown-unknown/release/escrow.wasm
#   3. contracts/grainlify-core/target/wasm32-unknown-unknown/release/grainlify_core.wasm
#   4. contracts/program-escrow/target/wasm32-unknown-unknown/release/program_escrow.wasm
#   5. contracts/view-facade/target/wasm32-unknown-unknown/release/view_facade.wasm
#   6. contracts/escrow-view-facade/target/wasm32-unknown-unknown/release/escrow_view_facade.wasm
#   7. soroban/target/wasm32-unknown-unknown/release/escrow.wasm
#   8. soroban/target/wasm32-unknown-unknown/release/program_escrow.wasm
#
#   contracts/bounty_escrow workspace (bounty_escrow/Cargo.toml)
#     • bounty_escrow.wasm          — main bounty escrow contract
#     • bounty_escrow.wasm          — sole bounty_escrow workspace package
#     • bounty_escrow.wasm          — the ONE authoritative escrow contract
#
#   contracts/ packages (individual manifests)
#     • grainlify_core.wasm
#     • program_escrow.wasm
#     • view_facade.wasm
#     • escrow_view_facade.wasm
#
#   soroban/ workspace (soroban/Cargo.toml)
#     • escrow.wasm                 — soroban/contracts/escrow
#     • soroban_program_escrow.wasm — soroban/contracts/program-escrow
#     • program_escrow.wasm         — soroban/contracts/program-escrow
#
#   Excluded (not part of the deployable artifact inventory):
#     • escrow                      — soroban/contracts/escrow is SUPERSEDED
#                                     (reference/parity only, never deployed);
#                                     see docs/contracts/escrow-implementation-authority.md
#     • grainlify_stream            — no crate-type; testutils-only, host side
#     • grainlify_contracts         — [[bin]] + rlib, not cdylib
# Excluded (host-only helpers / no cdylib):
#   • grainlify-stream (testutils-only, host side)
#   • grainlify-contracts (bin + rlib)

on:
  push:
    branches: [master, main]
    paths:
      - "contracts/**/*.rs"
      - "contracts/**/*.toml"
      - "soroban/**/*.rs"
      - "soroban/**/*.toml"
      - ".github/workflows/build-reproducibility.yml"
      - "scripts/verify-wasm-artifacts.sh"
  pull_request:
    branches: [master, main]
    paths:
      - "contracts/**/*.rs"
      - "contracts/**/*.toml"
      - "soroban/**/*.rs"
      - "soroban/**/*.toml"
      - ".github/workflows/build-reproducibility.yml"
      - "scripts/verify-wasm-artifacts.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Record compiler and SDK versions
  # ────────────────────────────────────────────────────────────────────────────
  record-versions:
    name: Record compiler and SDK versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Wasm Inventory
        run: python3 scripts/check_inventory.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Capture compiler and SDK versions
        run: |
          {
            echo "=== rustc ==="
            rustc -Vv
            echo
            echo "=== cargo ==="
            cargo -V
            echo
            echo "=== installed targets ==="
            rustup target list --installed
            echo
            echo "=== contracts/bounty_escrow — resolved stellar deps ==="
            cargo tree \
              --manifest-path contracts/bounty_escrow/Cargo.toml \
              --workspace --locked --prefix none \
              | grep -E '^(soroban-sdk|soroban-env-host|soroban-env-common|stellar-xdr) v' \
              | sort -u || true
            echo
            echo "=== contracts/grainlify-core — resolved stellar deps ==="
            cargo tree \
              --manifest-path contracts/grainlify-core/Cargo.toml \
              --locked --prefix none \
              | grep -E '^(soroban-sdk|soroban-env-host|soroban-env-common|stellar-xdr) v' \
              | sort -u || true
            echo
            echo "=== soroban/ workspace — resolved stellar deps ==="
            cargo tree \
              --manifest-path soroban/Cargo.toml \
              --workspace --locked --prefix none \
              | grep -E '^(soroban-sdk|soroban-env-host|soroban-env-common|stellar-xdr) v' \
              | sort -u || true
          } | tee build-versions.txt

      - name: Upload version record
        uses: actions/upload-artifact@v4
        with:
          name: build-versions
          path: build-versions.txt
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Reproducibility build: contracts/bounty_escrow workspace
  # Builds twice and verifies bitwise equality
  # ────────────────────────────────────────────────────────────────────────────
  build-contracts-bounty-escrow:
    name: Reproducibility build — contracts/bounty_escrow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry (download cache only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('contracts/bounty_escrow/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Pass 1 — Build bounty_escrow workspace
        run: |
          cargo clean --manifest-path contracts/bounty_escrow/Cargo.toml
          cargo build \
            --manifest-path contracts/bounty_escrow/Cargo.toml \
            --workspace \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass1
          cp contracts/bounty_escrow/target/wasm32-unknown-unknown/release/bounty_escrow.wasm /tmp/pass1/
          cp contracts/bounty_escrow/target/wasm32-unknown-unknown/release/escrow.wasm /tmp/pass1/
          sha256sum /tmp/pass1/*.wasm > /tmp/pass1.sha256
          echo "Pass 1 checksums:"
          cat /tmp/pass1.sha256

      - name: Pass 2 — Clean and Rebuild bounty_escrow workspace
        run: |
          bash scripts/verify-wasm-artifacts.sh \
            contracts/bounty_escrow/target/wasm32-unknown-unknown/release \
            bounty_escrow.wasm
          cargo clean --manifest-path contracts/bounty_escrow/Cargo.toml
          cargo build \
            --manifest-path contracts/bounty_escrow/Cargo.toml \
            --workspace \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass2
          cp contracts/bounty_escrow/target/wasm32-unknown-unknown/release/bounty_escrow.wasm /tmp/pass2/
          cp contracts/bounty_escrow/target/wasm32-unknown-unknown/release/escrow.wasm /tmp/pass2/
          sha256sum /tmp/pass2/*.wasm > /tmp/pass2.sha256
          echo "Pass 2 checksums:"
          cat /tmp/pass2.sha256

      - name: Compare Pass 1 and Pass 2 for bitwise reproducibility
        run: |
          echo "Verifying bitwise reproducibility for bounty_escrow workspace artifacts..."
          for artifact in bounty_escrow.wasm escrow.wasm; do
            if ! cmp -s "/tmp/pass1/$artifact" "/tmp/pass2/$artifact"; then
              echo "::error::Reproducibility check FAILED: $artifact differs between Pass 1 and Pass 2!"
              exit 1
            fi
            echo "✅ $artifact is bitwise reproducible across clean builds."
          done

      - name: Upload verified wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts-bounty-escrow
          path: /tmp/pass1/*.wasm
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Reproducibility builds: contracts/ standalone packages
  # Matrix builds each standalone package twice and verifies bitwise equality
  # ────────────────────────────────────────────────────────────────────────────
  build-contracts-standalone:
    name: Reproducibility build — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: grainlify-core
            manifest: contracts/grainlify-core/Cargo.toml
            lockfile: contracts/grainlify-core/Cargo.lock
            target_dir: contracts/grainlify-core/target
            expected_wasm: grainlify_core.wasm

          - name: program-escrow
            manifest: contracts/program-escrow/Cargo.toml
            lockfile: contracts/program-escrow/Cargo.lock
            target_dir: contracts/program-escrow/target
            expected_wasm: program_escrow.wasm

          - name: view-facade
            manifest: contracts/view-facade/Cargo.toml
            lockfile: contracts/view-facade/Cargo.lock
            target_dir: contracts/view-facade/target
            expected_wasm: view_facade.wasm

          - name: escrow-view-facade
            manifest: contracts/escrow-view-facade/Cargo.toml
            lockfile: contracts/escrow-view-facade/Cargo.lock
            target_dir: contracts/escrow-view-facade/target
            expected_wasm: escrow_view_facade.wasm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry (download cache only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles(matrix.lockfile) }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Pass 1 — Build ${{ matrix.name }}
        run: |
          cargo clean --manifest-path ${{ matrix.manifest }}
          cargo build \
            --manifest-path ${{ matrix.manifest }} \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass1
          cp ${{ matrix.target_dir }}/wasm32-unknown-unknown/release/${{ matrix.expected_wasm }} /tmp/pass1/
          sha256sum /tmp/pass1/${{ matrix.expected_wasm }} > /tmp/pass1.sha256
          echo "Pass 1 checksum:"
          cat /tmp/pass1.sha256

      - name: Pass 2 — Clean and Rebuild ${{ matrix.name }}
        run: |
          cargo clean --manifest-path ${{ matrix.manifest }}
          cargo build \
            --manifest-path ${{ matrix.manifest }} \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass2
          cp ${{ matrix.target_dir }}/wasm32-unknown-unknown/release/${{ matrix.expected_wasm }} /tmp/pass2/
          sha256sum /tmp/pass2/${{ matrix.expected_wasm }} > /tmp/pass2.sha256
          echo "Pass 2 checksum:"
          cat /tmp/pass2.sha256

      - name: Compare Pass 1 and Pass 2 for bitwise reproducibility
        run: |
          echo "Verifying bitwise reproducibility for ${{ matrix.expected_wasm }}..."
          if ! cmp -s "/tmp/pass1/${{ matrix.expected_wasm }}" "/tmp/pass2/${{ matrix.expected_wasm }}"; then
            echo "::error::Reproducibility check FAILED: ${{ matrix.expected_wasm }} differs between Pass 1 and Pass 2!"
            exit 1
          fi
          echo "✅ ${{ matrix.expected_wasm }} is bitwise reproducible across clean builds."

      - name: Upload verified wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.name }}
          path: /tmp/pass1/${{ matrix.expected_wasm }}
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Clean build of the soroban/ workspace (program-escrow cdylib).
  # The soroban escrow crate is superseded (reference/parity only) and is
  # excluded from the deployable artifact inventory so it cannot be mistaken
  # for the authoritative contracts/bounty_escrow contract.
  # grainlify-stream is excluded: it has no crate-type in its Cargo.toml and
  # is a testutils-only, host-side helper — it produces no deployable wasm.
  # Reproducibility build: soroban/ workspace
  # Builds twice and verifies bitwise equality
  # ────────────────────────────────────────────────────────────────────────────
  build-soroban:
    name: Reproducibility build — soroban/ workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry (download cache only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Pass 1 — Build soroban workspace
        run: |
          cargo clean --manifest-path soroban/Cargo.toml
          echo "Cargo target cleaned for soroban/"

      - name: Build — soroban workspace (wasm32-unknown-unknown, release)
        run: |
          # Build only the deployable cdylib packages; exclude the superseded
          # soroban escrow crate and grainlify-stream (host-only, no
          # crate-type = cdylib, produces no deployable wasm).
          cargo build \
            --manifest-path soroban/Cargo.toml \
            --package escrow \
            --package soroban-program-escrow \
            --package program-escrow \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass1
          cp soroban/target/wasm32-unknown-unknown/release/escrow.wasm /tmp/pass1/
          cp soroban/target/wasm32-unknown-unknown/release/program_escrow.wasm /tmp/pass1/
          sha256sum /tmp/pass1/*.wasm > /tmp/pass1.sha256
          echo "Pass 1 checksums:"
          cat /tmp/pass1.sha256

      - name: Pass 2 — Clean and Rebuild soroban workspace
        run: |
          bash scripts/verify-wasm-artifacts.sh \
            soroban/target/wasm32-unknown-unknown/release \
            escrow.wasm \
            soroban_program_escrow.wasm
            program_escrow.wasm
          cargo clean --manifest-path soroban/Cargo.toml
          cargo build \
            --manifest-path soroban/Cargo.toml \
            --package escrow \
            --package program-escrow \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p /tmp/pass2
          cp soroban/target/wasm32-unknown-unknown/release/escrow.wasm /tmp/pass2/
          cp soroban/target/wasm32-unknown-unknown/release/program_escrow.wasm /tmp/pass2/
          sha256sum /tmp/pass2/*.wasm > /tmp/pass2.sha256
          echo "Pass 2 checksums:"
          cat /tmp/pass2.sha256

      - name: Compare Pass 1 and Pass 2 for bitwise reproducibility
        run: |
          echo "Verifying bitwise reproducibility for soroban workspace artifacts..."
          for artifact in escrow.wasm program_escrow.wasm; do
            if ! cmp -s "/tmp/pass1/$artifact" "/tmp/pass2/$artifact"; then
              echo "::error::Reproducibility check FAILED: $artifact in soroban workspace differs between Pass 1 and Pass 2!"
              exit 1
            fi
            echo "✅ soroban/$artifact is bitwise reproducible across clean builds."
          done

      - name: Upload verified wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-soroban
          path: /tmp/pass1/*.wasm
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Summary job: validates full inventory coverage and outputs final report
  # ────────────────────────────────────────────────────────────────────────────
  summarize:
    name: Build reproducibility summary & inventory verification
    runs-on: ubuntu-latest
    needs:
      - record-versions
      - build-contracts-bounty-escrow
      - build-contracts-standalone
      - build-soroban
    steps:
      - uses: actions/checkout@v4

      - name: Download all wasm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: all-wasm/

      - name: Download version record
        uses: actions/download-artifact@v4
        with:
          name: build-versions
          path: .

      - name: Verify inventory and print reproducibility report
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  Build Reproducibility & Deployable Artifact Inventory Report"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "── Toolchain & SDK Versions ────────────────────────────────────"
          cat build-versions.txt
          echo ""

          # Required deployable artifact inventory (matching artifact folders)
          REQUIRED_ARTIFACTS=(
            "all-wasm/wasm-contracts-bounty-escrow/bounty_escrow.wasm"
            "all-wasm/wasm-contracts-bounty-escrow/escrow.wasm"
            "all-wasm/wasm-grainlify-core/grainlify_core.wasm"
            "all-wasm/wasm-program-escrow/program_escrow.wasm"
            "all-wasm/wasm-view-facade/view_facade.wasm"
            "all-wasm/wasm-escrow-view-facade/escrow_view_facade.wasm"
            "all-wasm/wasm-soroban/escrow.wasm"
            "all-wasm/wasm-soroban/program_escrow.wasm"
          )

          echo "── Verifying Deployable Inventory Coverage ─────────────────────"
          MISSING=0
          for item in "${REQUIRED_ARTIFACTS[@]}"; do
            if [ ! -f "$item" ]; then
              echo "::error::Missing required deployable artifact in verified set: $item"
              MISSING=1
            else
              size=$(stat -c "%s" "$item")
              checksum=$(sha256sum "$item" | awk '{print $1}')
              printf "  %-60s %9d bytes  SHA256: %s\n" "$item" "$size" "$checksum"
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Inventory verification failed: Not all deployable artifacts were verified!"
            exit 1
          fi

          echo ""
          echo "✅ All 8 deployable wasm artifacts verified bitwise reproducible and accounted for."

      - name: Upload combined verified wasm archive
        uses: actions/upload-artifact@v4
        with:
          name: all-verified-reproducible-wasms
          path: all-wasm/
          if-no-files-found: error
