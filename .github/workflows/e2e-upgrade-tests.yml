name: Contract smoke

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reentrancy:
    name: program-escrow reentrancy guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml (repository root) pins the compiler, the components
      # and both wasm targets; rustup installs it on first use.
      - name: Use the pinned Rust toolchain
        run: rustc -vV && cargo -V

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/program-escrow/target/
          key: ${{ runner.os }}-program-escrow-reentrancy-${{ hashFiles('contracts/program-escrow/Cargo.lock', 'contracts/program-escrow/Cargo.toml', 'contracts/grainify-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-program-escrow-reentrancy-

      - name: Run adversarial-token guard tests
        run: >
          cargo test --locked
          --manifest-path contracts/program-escrow/Cargo.toml
          reentrancy_tests::
