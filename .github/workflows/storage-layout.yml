name: Storage Layout Checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - "soroban/**"
      - "scripts/verify-storage-layout-manifest.py"
      - "contracts/scripts/**"
      - ".github/workflows/storage-layout.yml"
  push:
    branches: [main, develop, master]
    paths:
      - "contracts/**"
      - "soroban/**"
      - "scripts/verify-storage-layout-manifest.py"
      - "contracts/scripts/**"
      - ".github/workflows/storage-layout.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-storage-layout:
    name: Storage layout test target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown
      - name: test_storage_layout
        run: |
          cd contracts/grainlify-core
          cargo test --test test_storage_layout
      - name: validate snapshots and contracttype encodings
        run: python3 scripts/verify-storage-layout-manifest.py
      - name: program-escrow package exists
        run: test -f contracts/program-escrow/STORAGE_LAYOUT.md
      - name: soroban escrow snapshot exists
        run: test -f contracts/storage-layout/soroban-escrow.json
      - name: soroban program-escrow snapshot exists
        run: test -f contracts/storage-layout/soroban-program-escrow.json
      - name: soroban stream snapshot exists
        run: test -f contracts/storage-layout/soroban-stream.json
      - name: soroban persisted types covered by manifests
        run: python3 scripts/verify-storage-layout-manifest.py --require-soroban
