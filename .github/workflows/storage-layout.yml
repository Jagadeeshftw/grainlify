name: Storage Layout Checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/verify-storage-layout-manifest.py"
      - ".github/workflows/storage-layout.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main, develop, master]
    paths:
      - "contracts/**"
      - "scripts/verify-storage-layout-manifest.py"
      - ".github/workflows/storage-layout.yml"
      - "rust-toolchain.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-storage-layout:
    name: Storage layout test target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml (repository root) pins the compiler, the components
      # and both wasm targets; rustup installs it on first use.
      - name: Use the pinned Rust toolchain
        run: rustc -vV && cargo -V
      - name: test_storage_layout
        run: |
          cd contracts/grainlify-core
          cargo test --test test_storage_layout
      - name: validate snapshots and contracttype encodings
        run: python3 scripts/verify-storage-layout-manifest.py
      - name: program-escrow package exists
        run: test -f "$GITHUB_WORKSPACE/contracts/program-escrow/STORAGE_LAYOUT.md"
      - name: program-escrow storage layout doc exists
        run: test -f contracts/program-escrow/STORAGE_LAYOUT.md
