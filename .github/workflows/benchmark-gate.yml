name: "Benchmark Gate — bounty-escrow CI gas / resource thresholds"

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 4 * * *' # Nightly scheduled run defaults to strict
  workflow_dispatch:
    inputs:
      gas_mode:
        description: 'ESCROW_GAS_MODE (strict / warn / collect)'
        required: false
        default: 'strict'
        type: choice
        options:
        - strict
        - warn
        - collect

jobs:
  gate:
    name: bounty-escrow gas CI thresholds (strict / warn / collect)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Provision stable rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/bounty_escrow/contracts/escrow/target
          key: ${{ runner.os }}-cargo-bounty-escrow-gate-${{ hashFiles('contracts/bounty_escrow/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bounty-escrow-gate-

      - name: Set GAS_MODE env var (defaults to strict on PRs, pushes, and schedules)
        run: |
          MODE="${{ github.event.inputs.gas_mode || 'strict' }}"
          echo "ESCROW_GAS_MODE=$MODE" >> $GITHUB_ENV
          echo "Using ESCROW_GAS_MODE=$MODE"

      - name: cargo test gas_ci (strict gate against recorded baseline)
        working-directory: contracts/bounty_escrow/contracts/escrow
        run: >
          cargo test
          --features testutils
          gas_ci
          --
          --nocapture
          --test-threads=1

      - name: Upload gas benchmark report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-benchmark-report
          path: |
            contracts/bounty_escrow/contracts/escrow/gas_benchmark_report.md
            contracts/bounty_escrow/contracts/escrow/gas_baseline.json

      - name: Publish gas report to Step Summary
        if: always()
        run: |
          if [ -f contracts/bounty_escrow/contracts/escrow/gas_benchmark_report.md ]; then
            cat contracts/bounty_escrow/contracts/escrow/gas_benchmark_report.md >> $GITHUB_STEP_SUMMARY
          fi
