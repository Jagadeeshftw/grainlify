name: "Wasm Size Budget Gate"

on:
  push:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/wasm-budgets.json"
      - ".github/workflows/wasm-size-budget.yml"
      - "scripts/check-wasm-budgets.sh"
      - "scripts/update-wasm-budgets.sh"
      - "scripts/tests/test_check_wasm_budgets.sh"
  pull_request:
    branches: [master, main]
    paths:
      - "contracts/**"
      - "soroban/**"
      - ".github/wasm-budgets.json"
      - ".github/workflows/wasm-size-budget.yml"
      - "scripts/check-wasm-budgets.sh"
      - "scripts/update-wasm-budgets.sh"
      - "scripts/tests/test_check_wasm_budgets.sh"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  wasm-size-budget:
    name: "wasm size budget check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/**/target
            soroban/target
          key: wasm-budget-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '.github/wasm-budgets.json') }}
          restore-keys: |
            wasm-budget-${{ runner.os }}-

      # The gate script is pure bash + jq and is exercised without a Rust
      # toolchain, so a regression in the budget logic fails fast.
      - name: Check wasm budget script (regression tests)
        run: bash scripts/tests/test_check_wasm_budgets.sh

      - name: Build contracts (wasm32-unknown-unknown, release)
        run: |
          echo "━━━ Building bounty_escrow workspace ━━━"
          cargo build \
            --manifest-path contracts/bounty_escrow/Cargo.toml \
            --workspace \
            --target wasm32-unknown-unknown \
            --release \
            --locked

          echo ""
          echo "━━━ Building grainlify-core ━━━"
          cargo build \
            --manifest-path contracts/grainlify-core/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release \
            --locked

          echo ""
          echo "━━━ Building program-escrow ━━━"
          cargo build \
            --manifest-path contracts/program-escrow/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release \
            --locked

          echo ""
          echo "━━━ Building escrow-view-facade ━━━"
          cargo build \
            --manifest-path contracts/escrow-view-facade/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release \
            --locked

          echo ""
          echo "━━━ Building view-facade ━━━"
          cargo build \
            --manifest-path contracts/view-facade/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release \
            --locked

      - name: Build soroban workspace deployables (wasm32v1-none, release)
        working-directory: soroban
        run: |
          echo "━━━ Building soroban escrow ━━━"
          cargo build -p escrow --target wasm32v1-none --release --locked

          echo ""
          echo "━━━ Building soroban program-escrow ━━━"
          cargo build -p soroban-program-escrow --target wasm32v1-none --release --locked

      - name: List generated wasm files
        run: |
          echo "━━━ Generated .wasm artifacts ━━━"
          find contracts soroban -path "*/target/*/release/*.wasm" -type f -exec ls -lh {} \;

      - name: Check wasm sizes against budgets
        run: bash scripts/check-wasm-budgets.sh

      # NOTE: This workflow runs on `pull_request` from forks, where GitHub
      # forces GITHUB_TOKEN to read-only regardless of the `permissions:` block.
      # So it MUST NOT call the issues/PR API. Instead it generates the report
      # and uploads it as an artifact; the separate "wasm-size-budget-comment"
      # workflow (triggered on `workflow_run`, which runs with a write token in
      # the base-repo context) downloads it and posts the comment.
      - name: Generate budget report artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const budgetRaw = fs.readFileSync('.github/wasm-budgets.json', 'utf8');
            const budget = JSON.parse(budgetRaw);

            const ceiling = budget.absolute_ceiling_bytes;
            const tolerance = budget.tolerance_percent || 0;
            const ceilingLabel = ceiling ? ceiling.toLocaleString('en-US') + ' B' : '—';

            let report = '## 🔍 Wasm Size Budget Report\n\n';
            report += `Stellar deployment ceiling: **${ceilingLabel}** · growth tolerance: **${tolerance}%** over each baseline.\n\n`;
            report += '| Artifact | Workspace | Actual | Baseline | Growth limit | Status |\n';
            report += '|----------|-----------|--------|----------|--------------|--------|\n';

            const contracts = Object.keys(budget.budgets);
            let allPass = true;
            let built = 0;

            for (const name of contracts) {
              const cfg = budget.budgets[name];
              const wasmName = cfg.artifact || `${cfg.package.replace(/-/g, '_')}.wasm`;
              const target = cfg.target || 'wasm32-unknown-unknown';
              const wasmPath = `${cfg.target_dir}/target/${target}/release/${wasmName}`;
              const baseline = cfg.baseline_bytes;
              const growthLimit = baseline + Math.floor(baseline * tolerance / 100);
              const fmt = (n) => n.toLocaleString('en-US');

              let actual;
              try {
                actual = fs.statSync(wasmPath).size;
              } catch {
                report += `| ${name} | ${cfg.workspace || '—'} | ⚠️ not built | ${fmt(baseline)} B | ${fmt(growthLimit)} B | SKIP |\n`;
                continue;
              }
              built += 1;

              let status;
              if (ceiling && actual > ceiling) {
                status = '❌ FAIL (ceiling)';
                allPass = false;
              } else if (actual > growthLimit) {
                status = '❌ FAIL (growth)';
                allPass = false;
              } else {
                status = '✅ PASS';
              }

              report += `| ${name} | ${cfg.workspace || '—'} | ${fmt(actual)} B | ${fmt(baseline)} B | ${fmt(growthLimit)} B | ${status} |\n`;
            }

            report += `\n${allPass ? '✅ All built artifacts within budget.' : '❌ One or more artifacts are over budget.'}`;
            report += ` (${built}/${contracts.length} artifacts built)\n`;
            report += '\n> To update baselines intentionally, run `scripts/update-wasm-budgets.sh` and commit the result. Crossing the absolute deployment ceiling requires shrinking the contract, not raising the budget.';

            fs.writeFileSync('wasm-budget-report.md', report);
            console.log(report);

      - name: Upload budget report artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-budget-report
          path: wasm-budget-report.md
          if-no-files-found: warn
