name: Vercel Deploy

on:
  push:
    branches:
      - main
      - develop
      - master
    paths:
      - 'frontend/**'
      - 'website/**'
      - '.github/workflows/vercel-deploy.yml'
  pull_request:
    branches:
      - main
      - develop
      - master
    paths:
      - 'frontend/**'
      - 'website/**'

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-website:
    name: Deploy Website to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy Website to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          WORKING_DIRECTORY: website
          PRODUCTION: true

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy Frontend to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          WORKING_DIRECTORY: frontend
          PRODUCTION: true

  preview-deploy:
    name: Preview Deploy on Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Vercel preview prerequisites
        id: vercel-check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_FRONTEND: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping preview deployment because the PR is from a fork." 
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID_FRONTEND" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping preview deployment because required Vercel secrets are unavailable."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Frontend Preview to Vercel
        if: steps.vercel-check.outputs.can_deploy == 'true'
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          WORKING_DIRECTORY: frontend
          PRODUCTION: false
        
      - name: Comment PR with Preview URLs
        if: steps.vercel-check.outputs.can_deploy == 'true' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployments are being prepared for this PR. Check the Vercel deployment status above.'
            })
