name: Smart Contracts CI

on:
  push:
    branches: [master, main]
    paths:
      - "soroban/**"
      - "contracts/**"
      - "scripts/check-program-escrow-no-traps.py"
      - "scripts/tests/fixtures/program_escrow_unwrap_trap.rs"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "soroban/**"
      - "contracts/**"
      - "scripts/check-program-escrow-no-traps.py"
      - "scripts/tests/fixtures/program_escrow_unwrap_trap.rs"
      - ".github/workflows/contracts-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Manifest validation gate (schema + structure, npm-based).
  # Fast; no Rust toolchain required.
  # ──────────────────────────────────────────────────────────────
  validate-manifests:
    name: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate contract manifests
        run: npm test --prefix contracts

  # ──────────────────────────────────────────────────────────────
  # No opaque unwrap()/panic! traps in deployable program-escrow
  # source (issue #1854). Test modules remain exempt.
  # Batch semantics gate (issue #1877).
  # A separate job on purpose: `build-test` above aborts on pre-existing
  # bounty-escrow failures that have nothing to do with batching, and a step
  # after a failed step never runs. Without its own job the batch suites would
  # silently stop gating anything — which is the exact state #1877 found the
  # 1,354-line test_batch_operations.rs in (disabled in lib.rs, absent from CI).
  # ──────────────────────────────────────────────────────────────
  batch-tests:
    name: batch semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/bounty_escrow/target/
            contracts/program-escrow/target/
          key: ${{ runner.os }}-batch-tests-${{ hashFiles('contracts/bounty_escrow/Cargo.lock', 'contracts/program-escrow/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-batch-tests-

      - name: Run batch test suites
        run: bash contracts/scripts/ci-batch-tests.sh

  # ──────────────────────────────────────────────────────────────
  # Reproducible workspace build & test gates (issue #1700).
  # Runs the exact same commands as ./contracts/scripts/ci-contracts.sh
  # so the gates behave identically locally and in CI.
  # No continue-on-error: a compile or test regression must fail the job.
  # ──────────────────────────────────────────────────────────────
  program-escrow-no-traps:
    name: program-escrow no unwrap/panic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid unwrap()/panic! in deployable lib.rs
        run: python3 scripts/check-program-escrow-no-traps.py
      - name: Fixture proves the check fails on a planted unwrap()
        run: >
          python3 scripts/check-program-escrow-no-traps.py
          --fixture scripts/tests/fixtures/program_escrow_unwrap_trap.rs
          --expect-fail

  # ──────────────────────────────────────────────────────────────
  # Reproducible workspace build & test gates (issue #1700).
  # Reproducible workspace build, test, and clippy gates (issue #1700, #1857).
  # Runs the exact same commands as ./contracts/scripts/ci-contracts.sh
  # so the gates behave identically locally and in CI.
  # No continue-on-error: a compile, lint, or test regression must fail the job.
  # ──────────────────────────────────────────────────────────────
  build-test:
    name: contracts (workspace clippy + tests + wasm release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Wasm Inventory
        run: python3 scripts/check_inventory.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown
          components: clippy

      # Cache only the Cargo registry/git caches and the workspace target dir
      # (keyed on the lockfile). Toolchain binaries in ~/.cargo/bin are NOT
      # cached so the pinned Rust/Soroban toolchain always comes from rustup.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/bounty_escrow/target/
            contracts/program-escrow/target/
          key: ${{ runner.os }}-contracts-cargo-${{ hashFiles('contracts/bounty_escrow/Cargo.lock', 'contracts/bounty_escrow/Cargo.toml', 'contracts/program-escrow/Cargo.lock', 'contracts/program-escrow/Cargo.toml', 'contracts/grainlify-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-contracts-cargo-

      - name: Run contract CI gates
        run: bash contracts/scripts/ci-contracts.sh
        # ci-contracts.sh runs (in order):
        #   [1] cargo test on the bounty_escrow workspace – includes:
        #       • test_analytics_monitoring  (issue #1882: analytics & monitoring suite)
        #       • test_query_filters         (issue #1882: query-filter suite)
        #       • all other enabled test modules
        #   [2] cargo test on the grainlify-contracts workspace (storage-key audit)
        #   [3] wasm release build + size recording

      - name: Run token allowlist + FoT routing suites
        run: cargo test --manifest-path contracts/program-escrow/Cargo.toml -- test_token_allowlist test_fot_routing

      - name: Upload deployable wasm
        uses: actions/upload-artifact@v4
        with:
          name: bounty-escrow-wasm
          path: contracts/bounty_escrow/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # View-facade drift gate (issue #1870).
  # Each facade mirrors types and feature flags from program-escrow.
  # This job is deliberately standalone rather than folded into the
  # `build-test` job above: that job currently stops at its first step on
  # a pre-existing failure in the bounty-escrow workspace suite, and a gate
  # that never runs cannot catch drift. The exhaustive struct literals in
  # tests/conformance.rs turn a contract-only field addition into a compile
  # error here.
  # ──────────────────────────────────────────────────────────────
  facade-conformance:
    name: view facades match the contracts they mirror
  # Feature-flag matrix & facade default-features assertion gates (issue #1885).
  # Asserts every supported feature combination builds and facades'
  # default-features = false requirement is satisfied.
  # ──────────────────────────────────────────────────────────────
  feature-flag-matrix:
    name: feature-flags (grainlify-core combinations matrix)
  # grainlify-core gates (issue #1869).
  # grainlify-core is depended on by program-escrow, view-facade and
  # escrow-view-facade, so it gets the same build/test gates as the escrow
  # crates plus the crate's formatting and lint gates. Runs the exact same
  # commands as ./contracts/scripts/ci-grainlify-core.sh.
  # No continue-on-error: a failing test (including a migration-replay or
  # upgrade-rollback test) must fail the job.
  # ──────────────────────────────────────────────────────────────
  grainlify-core:
    name: grainlify-core (fmt + clippy + tests + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          targets: wasm32v1-none, wasm32-unknown-unknown
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/view-facade/target/
            contracts/escrow-view-facade/target/
          key: ${{ runner.os }}-facade-conformance-${{ hashFiles('contracts/view-facade/Cargo.lock', 'contracts/escrow-view-facade/Cargo.lock', 'contracts/program-escrow/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-facade-conformance-

      - name: view-facade conformance
        run: |
          cargo test \
            --manifest-path contracts/view-facade/Cargo.toml \
            --test conformance \
            --test dependency_gating

      - name: escrow-view-facade conformance
        run: |
          cargo test \
            --manifest-path contracts/escrow-view-facade/Cargo.toml \
            --test conformance \
            --test dependency_gating
            contracts/grainlify-core/target/
          key: ${{ runner.os }}-contracts-feature-matrix-${{ hashFiles('contracts/grainlify-core/Cargo.toml', 'contracts/grainlify-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contracts-feature-matrix-

      - name: Run feature matrix and facade build assertions
        run: bash contracts/scripts/check-feature-matrix.sh
            contracts/grainlify-core/target/
          key: ${{ runner.os }}-grainlify-core-cargo-${{ hashFiles('contracts/grainlify-core/Cargo.lock', 'contracts/grainlify-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-grainlify-core-cargo-

      - name: Run grainlify-core CI gates
        run: bash contracts/scripts/ci-grainlify-core.sh

      - name: Upload deployable wasm
        uses: actions/upload-artifact@v4
        with:
          name: grainlify-core-wasm
          path: contracts/grainlify-core/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
