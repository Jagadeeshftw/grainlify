name: Smart Contracts CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Clippy lint gate for deployable contract crates.
  # Every crate listed here MUST pass `cargo clippy -- -D warnings`.
  # Deliberate violations require a narrow #[allow(...)] with a
  # justification comment; crate-wide suppressions are rejected.
  # ──────────────────────────────────────────────────────────────
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bounty-escrow
            manifest: contracts/bounty_escrow/Cargo.toml
            args: --workspace --all-targets
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate contract manifests
        run: npm test --prefix contracts
