name: Smart Contracts CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Clippy lint gate for deployable contract crates.
  # Every crate listed here MUST pass `cargo clippy -- -D warnings`.
  # Deliberate violations require a narrow #[allow(...)] with a
  # justification comment; crate-wide suppressions are rejected.
  # ──────────────────────────────────────────────────────────────
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bounty-escrow
            manifest: contracts/bounty_escrow/Cargo.toml
            args: --workspace --all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/bounty_escrow
      - name: Run clippy
        run: |
          cargo clippy \
            --manifest-path ${{ matrix.manifest }} \
            ${{ matrix.args }} \
            -- -D warnings

  # ──────────────────────────────────────────────────────────────
  # Build & test for crates that compile cleanly.
  # ──────────────────────────────────────────────────────────────
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bounty-escrow
            manifest: contracts/bounty_escrow/Cargo.toml
            args: --workspace --all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/bounty_escrow
      - name: Build
        run: cargo build --manifest-path ${{ matrix.manifest }} ${{ matrix.args }}
      - name: Test
        run: cargo test --manifest-path ${{ matrix.manifest }} ${{ matrix.args }}