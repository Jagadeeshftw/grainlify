name: Smart Contracts CI

on:
  push:
    branches: [master, main]
    paths:
      - "soroban/**"
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "soroban/**"
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Manifest validation gate (schema + structure, npm-based).
  # Fast; no Rust toolchain required.
  # ──────────────────────────────────────────────────────────────
  validate-manifests:
    name: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate contract manifests
        run: npm test --prefix contracts

  # ──────────────────────────────────────────────────────────────
  # Reproducible workspace build & test gates (issue #1700).
  # Runs the exact same commands as ./contracts/scripts/ci-contracts.sh
  # so the gates behave identically locally and in CI.
  # No continue-on-error: a compile or test regression must fail the job.
  # ──────────────────────────────────────────────────────────────
  build-test:
    name: contracts (workspace tests + wasm release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      # Cache only the Cargo registry/git caches and the workspace target dir
      # (keyed on the lockfile). Toolchain binaries in ~/.cargo/bin are NOT
      # cached so the pinned Rust/Soroban toolchain always comes from rustup.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/bounty_escrow/target/
          key: ${{ runner.os }}-contracts-cargo-${{ hashFiles('contracts/bounty_escrow/Cargo.lock', 'contracts/bounty_escrow/Cargo.toml', 'contracts/grainlify-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-contracts-cargo-

      - name: Run contract CI gates
        run: bash contracts/scripts/ci-contracts.sh

      - name: Upload deployable wasm
        uses: actions/upload-artifact@v4
        with:
          name: bounty-escrow-wasm
          path: contracts/bounty_escrow/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # Soroban workspace gates (issue #1860).
  #
  # The `soroban/` workspace declares members `contracts/*` (escrow,
  # program-escrow, stream) but was previously covered by nothing: the
  # build-test job above builds only `contracts/bounty_escrow`, and every
  # other workflow filters on `contracts/**`. This job brings the workspace
  # — and in particular the `grainlify-stream` fixture crate — under the
  # same build, test, formatting and clippy gates, and produces + size-checks
  # the workspace's deployable wasm. There is no continue-on-error: a failing
  # test fails the job.
  #
  # fmt/clippy are scoped to `grainlify-stream` (the crate called out in the
  # issue). The two contract crates predate these gates and currently carry
  # pre-existing fmt/clippy drift that is out of scope here.
  # ──────────────────────────────────────────────────────────────
  soroban-workspace:
    name: soroban (tests + fmt + clippy + wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soroban
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            soroban/target/
          key: ${{ runner.os }}-soroban-cargo-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soroban-cargo-

      - name: Formatting gate (grainlify-stream)
        run: cargo fmt -p grainlify-stream --check

      - name: Clippy gate (grainlify-stream)
        run: cargo clippy -p grainlify-stream --all-targets -- -D warnings

      - name: Compile and run stream crate tests
        run: cargo test -p grainlify-stream

      - name: Build deployable wasm (soroban workspace)
        run: |
          cargo build -p escrow --target wasm32v1-none --release
          cargo build -p soroban-program-escrow --target wasm32v1-none --release

      - name: Check deployable wasm sizes
        run: |
          set -euo pipefail
          check() {
            name="$1"; budget="$2"
            file="target/wasm32v1-none/release/${name}.wasm"
            if [ ! -f "$file" ]; then
              echo "::error::expected wasm artifact was not produced: $file"
              exit 1
            fi
            size=$(stat -c%s "$file")
            echo "$name.wasm: ${size} bytes (budget ${budget})"
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$name.wasm (${size} B) exceeds its budget (${budget} B)"
              exit 1
            fi
          }
          check escrow 120000
          check soroban_program_escrow 120000

      - name: Upload deployable wasm
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: soroban/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
